name: Generate Snake Contribution Grid

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HussainRiaz-sudo
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E76F51&color_dots=#111e16,#2d6a4f,#f4a261,#e76f51,#d90429
            dist/github-contribution-grid-snake-dark.svg?color_snake=#E76F51&color_dots=#111e16,#2d6a4f,#f4a261,#e76f51,#d90429

      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
