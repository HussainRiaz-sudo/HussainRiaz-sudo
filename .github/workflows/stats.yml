name: Update GitHub Stats & Languages

on:
  schedule:
    # Run twice daily at 00:15 and 12:15 UTC
    - cron: "15 0,12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_stats.py"
      - ".github/workflows/stats.yml"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Stats & Top Languages SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_stats.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update GitHub stats and top languages [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
